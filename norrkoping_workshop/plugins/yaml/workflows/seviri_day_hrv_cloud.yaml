apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_hrv_cloud
docstring: |
    pass
spec:
    globals:
        product_name: DayHRVCloud
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayHRVCloud:
            kind: product
            name: [seviri, DayHRVCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayHRVCloud.algorithm, sector, seviri_DayHRVCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayHRVCloud.algorithm
                - seviri_DayHRVCloud.colormapper
                - filename_formatter
                - sector
