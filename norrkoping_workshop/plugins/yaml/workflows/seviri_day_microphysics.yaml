apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayMicrophysics:
            kind: product
            name: [seviri, DayMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayMicrophysics.algorithm, sector, seviri_DayMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayMicrophysics.algorithm
                - seviri_DayMicrophysics.colormapper
                - filename_formatter
                - sector
