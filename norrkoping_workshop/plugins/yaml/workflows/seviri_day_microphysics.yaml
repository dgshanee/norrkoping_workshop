apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: Day-Microphysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_Day_Microphysics:
            kind: product
            name: [seviri, Day-Microphysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_Day_Microphysics.algorithm, sector, seviri_Day_Microphysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_Day_Microphysics.algorithm
                - seviri_Day_Microphysics.colormapper
                - filename_formatter
                - sector
