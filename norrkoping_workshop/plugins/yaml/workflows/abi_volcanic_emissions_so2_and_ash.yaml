apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_volcanic_emissions_so2_and_ash
docstring: |
    pass
spec:
    globals:
        product_name: VolcanicEmissionsSO2andAsh
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_VolcanicEmissionsSO2andAsh:
            kind: product
            name: [abi, VolcanicEmissionsSO2andAsh]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_VolcanicEmissionsSO2andAsh.algorithm, sector, abi_VolcanicEmissionsSO2andAsh.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_VolcanicEmissionsSO2andAsh.algorithm
                - abi_VolcanicEmissionsSO2andAsh.colormapper
                - filename_formatter
                - sector
