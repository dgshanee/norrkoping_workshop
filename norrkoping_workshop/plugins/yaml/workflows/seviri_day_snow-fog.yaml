apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_snow-fog
docstring: |
    pass
spec:
    globals:
        product_name: DaySnow-Fog
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DaySnow-Fog:
            kind: product
            name: [seviri, DaySnow-Fog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DaySnow-Fog.algorithm, sector, seviri_DaySnow-Fog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DaySnow-Fog.algorithm
                - seviri_DaySnow-Fog.colormapper
                - filename_formatter
                - sector
