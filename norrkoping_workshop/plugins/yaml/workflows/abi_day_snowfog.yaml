apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_snowfog
docstring: |
    pass
spec:
    globals:
        product_name: DaySnowFog
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DaySnowFog:
            kind: product
            name: [abi, DaySnowFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DaySnowFog.algorithm, sector, abi_DaySnowFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DaySnowFog.algorithm
                - abi_DaySnowFog.colormapper
                - filename_formatter
                - sector
