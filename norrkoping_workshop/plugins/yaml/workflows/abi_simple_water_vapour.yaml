apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_simple_water_vapour
docstring: |
    pass
spec:
    globals:
        product_name: SimpleWaterVapour
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_SimpleWaterVapour:
            kind: product
            name: [abi, SimpleWaterVapour]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_SimpleWaterVapour.algorithm, sector, abi_SimpleWaterVapour.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_SimpleWaterVapour.algorithm
                - abi_SimpleWaterVapour.colormapper
                - filename_formatter
                - sector
