apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_fire
docstring: |
    pass
spec:
    globals:
        product_name: DayFire
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayFire:
            kind: product
            name: [ahi, DayFire]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayFire.algorithm, sector, ahi_DayFire.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayFire.algorithm
                - ahi_DayFire.colormapper
                - filename_formatter
                - sector
