apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_microphysics_(with_nir_1.6,_legacy)
docstring: |
    pass
spec:
    globals:
        product_name: Day-Microphysics-(with-NIR-1.6,-Legacy)
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_Day_Microphysics_(with_NIR_1.6,_Legacy):
            kind: product
            name: [fci, Day-Microphysics-(with-NIR-1.6,-Legacy)]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_Day_Microphysics_(with_NIR_1.6,_Legacy).algorithm, sector, fci_Day_Microphysics_(with_NIR_1.6,_Legacy).coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_Day_Microphysics_(with_NIR_1.6,_Legacy).algorithm
                - fci_Day_Microphysics_(with_NIR_1.6,_Legacy).colormapper
                - filename_formatter
                - sector
