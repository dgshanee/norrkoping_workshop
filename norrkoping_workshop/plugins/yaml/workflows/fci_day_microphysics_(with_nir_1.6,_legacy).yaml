apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_microphysics_(with_nir_1.6,_legacy)
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysics(withNIR1.6,Legacy)
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayMicrophysics(withNIR1.6,Legacy):
            kind: product
            name: [fci, DayMicrophysics(withNIR1.6,Legacy)]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayMicrophysics(withNIR1.6,Legacy).algorithm, sector, fci_DayMicrophysics(withNIR1.6,Legacy).coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayMicrophysics(withNIR1.6,Legacy).algorithm
                - fci_DayMicrophysics(withNIR1.6,Legacy).colormapper
                - filename_formatter
                - sector
