apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_airmass
docstring: |
    pass
spec:
    globals:
        product_name: Airmass
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Airmass:
            kind: product
            name: [ahi, Airmass]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Airmass.algorithm, sector, ahi_Airmass.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Airmass.algorithm
                - ahi_Airmass.colormapper
                - filename_formatter
                - sector
