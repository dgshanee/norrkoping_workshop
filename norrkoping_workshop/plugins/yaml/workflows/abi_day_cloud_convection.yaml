apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudConvection
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayCloudConvection:
            kind: product
            name: [abi, DayCloudConvection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayCloudConvection.algorithm, sector, abi_DayCloudConvection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayCloudConvection.algorithm
                - abi_DayCloudConvection.colormapper
                - filename_formatter
                - sector
