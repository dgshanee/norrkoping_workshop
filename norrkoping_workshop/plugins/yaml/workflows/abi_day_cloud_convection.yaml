apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Convection
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_Day_Cloud_Convection:
            kind: product
            name: [abi, Day-Cloud-Convection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_Day_Cloud_Convection.algorithm, sector, abi_Day_Cloud_Convection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_Day_Cloud_Convection.algorithm
                - abi_Day_Cloud_Convection.colormapper
                - filename_formatter
                - sector
