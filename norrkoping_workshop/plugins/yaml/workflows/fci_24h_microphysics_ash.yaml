apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_24h_microphysics_ash
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsAsh
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_24HMicrophysicsAsh:
            kind: product
            name: [fci, 24HMicrophysicsAsh]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_24HMicrophysicsAsh.algorithm, sector, fci_24HMicrophysicsAsh.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_24HMicrophysicsAsh.algorithm
                - fci_24HMicrophysicsAsh.colormapper
                - filename_formatter
                - sector
