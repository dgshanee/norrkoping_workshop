apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Convection
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_Day_Cloud_Convection:
            kind: product
            name: [seviri, Day-Cloud-Convection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_Day_Cloud_Convection.algorithm, sector, seviri_Day_Cloud_Convection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_Day_Cloud_Convection.algorithm
                - seviri_Day_Cloud_Convection.colormapper
                - filename_formatter
                - sector
