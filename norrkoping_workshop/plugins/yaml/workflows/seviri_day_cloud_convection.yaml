apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudConvection
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayCloudConvection:
            kind: product
            name: [seviri, DayCloudConvection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayCloudConvection.algorithm, sector, seviri_DayCloudConvection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayCloudConvection.algorithm
                - seviri_DayCloudConvection.colormapper
                - filename_formatter
                - sector
