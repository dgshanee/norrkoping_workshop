apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_24h_microphysics_ash
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsAsh
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_24HMicrophysicsAsh:
            kind: product
            name: [seviri, 24HMicrophysicsAsh]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_24HMicrophysicsAsh.algorithm, sector, seviri_24HMicrophysicsAsh.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_24HMicrophysicsAsh.algorithm
                - seviri_24HMicrophysicsAsh.colormapper
                - filename_formatter
                - sector
