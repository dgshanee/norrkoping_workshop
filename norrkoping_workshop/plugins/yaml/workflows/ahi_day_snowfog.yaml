apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_snowfog
docstring: |
    pass
spec:
    globals:
        product_name: DaySnowFog
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DaySnowFog:
            kind: product
            name: [ahi, DaySnowFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DaySnowFog.algorithm, sector, ahi_DaySnowFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DaySnowFog.algorithm
                - ahi_DaySnowFog.colormapper
                - filename_formatter
                - sector
