apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_volcanic_emissions_(so2_and_ash)
docstring: |
    pass
spec:
    globals:
        product_name: Volcanic-Emissions-(SO2-and-Ash)
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Volcanic_Emissions_(SO2_and_Ash):
            kind: product
            name: [ahi, Volcanic-Emissions-(SO2-and-Ash)]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Volcanic_Emissions_(SO2_and_Ash).algorithm, sector, ahi_Volcanic_Emissions_(SO2_and_Ash).coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Volcanic_Emissions_(SO2_and_Ash).algorithm
                - ahi_Volcanic_Emissions_(SO2_and_Ash).colormapper
                - filename_formatter
                - sector
