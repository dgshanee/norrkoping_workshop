apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_microphysics_with_nir_16_legacy
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysicswithNIR16Legacy
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayMicrophysicswithNIR16Legacy:
            kind: product
            name: [abi, DayMicrophysicswithNIR16Legacy]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayMicrophysicswithNIR16Legacy.algorithm, sector, abi_DayMicrophysicswithNIR16Legacy.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayMicrophysicswithNIR16Legacy.algorithm
                - abi_DayMicrophysicswithNIR16Legacy.colormapper
                - filename_formatter
                - sector
