apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRV-Fog
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_HRV_Fog:
            kind: product
            name: [seviri, HRV-Fog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_HRV_Fog.algorithm, sector, seviri_HRV_Fog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_HRV_Fog.algorithm
                - seviri_HRV_Fog.colormapper
                - filename_formatter
                - sector
