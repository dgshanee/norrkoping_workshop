apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRVFog
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_HRVFog:
            kind: product
            name: [seviri, HRVFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_HRVFog.algorithm, sector, seviri_HRVFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_HRVFog.algorithm
                - seviri_HRVFog.colormapper
                - filename_formatter
                - sector
