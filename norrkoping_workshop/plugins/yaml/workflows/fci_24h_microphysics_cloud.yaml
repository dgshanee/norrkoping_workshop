apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_24h_microphysics_cloud
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsCloud
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_24HMicrophysicsCloud:
            kind: product
            name: [fci, 24HMicrophysicsCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_24HMicrophysicsCloud.algorithm, sector, fci_24HMicrophysicsCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_24HMicrophysicsCloud.algorithm
                - fci_24HMicrophysicsCloud.colormapper
                - filename_formatter
                - sector
