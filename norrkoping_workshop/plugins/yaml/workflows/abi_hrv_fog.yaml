apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRV-Fog
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_HRV_Fog:
            kind: product
            name: [abi, HRV-Fog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_HRV_Fog.algorithm, sector, abi_HRV_Fog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_HRV_Fog.algorithm
                - abi_HRV_Fog.colormapper
                - filename_formatter
                - sector
