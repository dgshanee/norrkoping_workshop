apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRVFog
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_HRVFog:
            kind: product
            name: [abi, HRVFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_HRVFog.algorithm, sector, abi_HRVFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_HRVFog.algorithm
                - abi_HRVFog.colormapper
                - filename_formatter
                - sector
