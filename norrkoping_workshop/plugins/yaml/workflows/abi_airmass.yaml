apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_airmass
docstring: |
    pass
spec:
    globals:
        product_name: Airmass
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_Airmass:
            kind: product
            name: [abi, Airmass]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_Airmass.algorithm, sector, abi_Airmass.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_Airmass.algorithm
                - abi_Airmass.colormapper
                - filename_formatter
                - sector
