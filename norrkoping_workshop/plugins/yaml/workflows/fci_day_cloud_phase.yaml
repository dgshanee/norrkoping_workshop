apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_cloud_phase
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudPhase
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayCloudPhase:
            kind: product
            name: [fci, DayCloudPhase]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayCloudPhase.algorithm, sector, fci_DayCloudPhase.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayCloudPhase.algorithm
                - fci_DayCloudPhase.colormapper
                - filename_formatter
                - sector
