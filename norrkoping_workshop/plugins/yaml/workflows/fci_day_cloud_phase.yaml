apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_cloud_phase
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Phase
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_Day_Cloud_Phase:
            kind: product
            name: [fci, Day-Cloud-Phase]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_Day_Cloud_Phase.algorithm, sector, fci_Day_Cloud_Phase.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_Day_Cloud_Phase.algorithm
                - fci_Day_Cloud_Phase.colormapper
                - filename_formatter
                - sector
