apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_fire_temperature
docstring: |
    pass
spec:
    globals:
        product_name: FireTemperature
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_FireTemperature:
            kind: product
            name: [ahi, FireTemperature]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_FireTemperature.algorithm, sector, ahi_FireTemperature.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_FireTemperature.algorithm
                - ahi_FireTemperature.colormapper
                - filename_formatter
                - sector
