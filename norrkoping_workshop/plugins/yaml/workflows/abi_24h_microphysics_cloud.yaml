apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_24h_microphysics_cloud
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsCloud
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_24HMicrophysicsCloud:
            kind: product
            name: [abi, 24HMicrophysicsCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_24HMicrophysicsCloud.algorithm, sector, abi_24HMicrophysicsCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_24HMicrophysicsCloud.algorithm
                - abi_24HMicrophysicsCloud.colormapper
                - filename_formatter
                - sector
