apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_land_cloud
docstring: |
    pass
spec:
    globals:
        product_name: DayLandCloud
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayLandCloud:
            kind: product
            name: [abi, DayLandCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayLandCloud.algorithm, sector, abi_DayLandCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayLandCloud.algorithm
                - abi_DayLandCloud.colormapper
                - filename_formatter
                - sector
