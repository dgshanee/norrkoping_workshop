apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysics
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayMicrophysics:
            kind: product
            name: [abi, DayMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayMicrophysics.algorithm, sector, abi_DayMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayMicrophysics.algorithm
                - abi_DayMicrophysics.colormapper
                - filename_formatter
                - sector
