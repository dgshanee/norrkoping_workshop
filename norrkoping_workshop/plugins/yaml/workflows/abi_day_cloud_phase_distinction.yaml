apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_phase_distinction
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudPhaseDistinction
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayCloudPhaseDistinction:
            kind: product
            name: [abi, DayCloudPhaseDistinction]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayCloudPhaseDistinction.algorithm, sector, abi_DayCloudPhaseDistinction.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayCloudPhaseDistinction.algorithm
                - abi_DayCloudPhaseDistinction.colormapper
                - filename_formatter
                - sector
