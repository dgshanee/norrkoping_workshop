apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_fire
docstring: |
    pass
spec:
    globals:
        product_name: DayFire
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayFire:
            kind: product
            name: [seviri, DayFire]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayFire.algorithm, sector, seviri_DayFire.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayFire.algorithm
                - seviri_DayFire.colormapper
                - filename_formatter
                - sector
