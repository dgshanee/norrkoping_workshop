apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_snowfog
docstring: |
    pass
spec:
    globals:
        product_name: DaySnowFog
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DaySnowFog:
            kind: product
            name: [seviri, DaySnowFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DaySnowFog.algorithm, sector, seviri_DaySnowFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DaySnowFog.algorithm
                - seviri_DaySnowFog.colormapper
                - filename_formatter
                - sector
