apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_land_cloud
docstring: |
    pass
spec:
    globals:
        product_name: DayLandCloud
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayLandCloud:
            kind: product
            name: [seviri, DayLandCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayLandCloud.algorithm, sector, seviri_DayLandCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayLandCloud.algorithm
                - seviri_DayLandCloud.colormapper
                - filename_formatter
                - sector
