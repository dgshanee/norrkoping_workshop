apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_fire
docstring: |
    pass
spec:
    globals:
        product_name: DayFire
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayFire:
            kind: product
            name: [abi, DayFire]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayFire.algorithm, sector, abi_DayFire.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayFire.algorithm
                - abi_DayFire.colormapper
                - filename_formatter
                - sector
