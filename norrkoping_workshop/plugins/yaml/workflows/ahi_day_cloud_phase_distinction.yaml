apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_cloud_phase_distinction
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Phase-Distinction
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Day_Cloud_Phase_Distinction:
            kind: product
            name: [ahi, Day-Cloud-Phase-Distinction]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Day_Cloud_Phase_Distinction.algorithm, sector, ahi_Day_Cloud_Phase_Distinction.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Day_Cloud_Phase_Distinction.algorithm
                - ahi_Day_Cloud_Phase_Distinction.colormapper
                - filename_formatter
                - sector
