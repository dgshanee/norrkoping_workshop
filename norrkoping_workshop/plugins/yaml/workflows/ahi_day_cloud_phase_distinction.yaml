apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_cloud_phase_distinction
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudPhaseDistinction
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayCloudPhaseDistinction:
            kind: product
            name: [ahi, DayCloudPhaseDistinction]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayCloudPhaseDistinction.algorithm, sector, ahi_DayCloudPhaseDistinction.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayCloudPhaseDistinction.algorithm
                - ahi_DayCloudPhaseDistinction.colormapper
                - filename_formatter
                - sector
