apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_airmass
docstring: |
    pass
spec:
    globals:
        product_name: Airmass
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_Airmass:
            kind: product
            name: [fci, Airmass]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_Airmass.algorithm, sector, fci_Airmass.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_Airmass.algorithm
                - fci_Airmass.colormapper
                - filename_formatter
                - sector
