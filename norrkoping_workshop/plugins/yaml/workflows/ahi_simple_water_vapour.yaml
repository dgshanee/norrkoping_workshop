apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_simple_water_vapour
docstring: |
    pass
spec:
    globals:
        product_name: SimpleWaterVapour
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_SimpleWaterVapour:
            kind: product
            name: [ahi, SimpleWaterVapour]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_SimpleWaterVapour.algorithm, sector, ahi_SimpleWaterVapour.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_SimpleWaterVapour.algorithm
                - ahi_SimpleWaterVapour.colormapper
                - filename_formatter
                - sector
