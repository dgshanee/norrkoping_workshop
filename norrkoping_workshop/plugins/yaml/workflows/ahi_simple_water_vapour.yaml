apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_simple_water_vapour
docstring: |
    pass
spec:
    globals:
        product_name: Simple-Water-Vapour
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Simple_Water_Vapour:
            kind: product
            name: [ahi, Simple-Water-Vapour]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Simple_Water_Vapour.algorithm, sector, ahi_Simple_Water_Vapour.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Simple_Water_Vapour.algorithm
                - ahi_Simple_Water_Vapour.colormapper
                - filename_formatter
                - sector
