apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_snow-fog
docstring: |
    pass
spec:
    globals:
        product_name: DaySnow-Fog
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DaySnow-Fog:
            kind: product
            name: [abi, DaySnow-Fog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DaySnow-Fog.algorithm, sector, abi_DaySnow-Fog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DaySnow-Fog.algorithm
                - abi_DaySnow-Fog.colormapper
                - filename_formatter
                - sector
