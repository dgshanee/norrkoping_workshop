apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRVFog
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_HRVFog:
            kind: product
            name: [fci, HRVFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_HRVFog.algorithm, sector, fci_HRVFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_HRVFog.algorithm
                - fci_HRVFog.colormapper
                - filename_formatter
                - sector
