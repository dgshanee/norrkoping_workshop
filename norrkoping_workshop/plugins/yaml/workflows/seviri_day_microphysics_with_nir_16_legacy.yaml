apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_microphysics_with_nir_16_legacy
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysicswithNIR16Legacy
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DayMicrophysicswithNIR16Legacy:
            kind: product
            name: [seviri, DayMicrophysicswithNIR16Legacy]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DayMicrophysicswithNIR16Legacy.algorithm, sector, seviri_DayMicrophysicswithNIR16Legacy.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DayMicrophysicswithNIR16Legacy.algorithm
                - seviri_DayMicrophysicswithNIR16Legacy.colormapper
                - filename_formatter
                - sector
