apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_24h_microphysics_ash
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsAsh
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_24HMicrophysicsAsh:
            kind: product
            name: [ahi, 24HMicrophysicsAsh]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_24HMicrophysicsAsh.algorithm, sector, ahi_24HMicrophysicsAsh.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_24HMicrophysicsAsh.algorithm
                - ahi_24HMicrophysicsAsh.colormapper
                - filename_formatter
                - sector
