apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_cloud_type
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudType
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayCloudType:
            kind: product
            name: [fci, DayCloudType]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayCloudType.algorithm, sector, fci_DayCloudType.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayCloudType.algorithm
                - fci_DayCloudType.colormapper
                - filename_formatter
                - sector
