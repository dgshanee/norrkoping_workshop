apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_overshooting_tops
docstring: |
    pass
spec:
    globals:
        product_name: Overshooting-Tops
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_Overshooting_Tops:
            kind: product
            name: [seviri, Overshooting-Tops]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_Overshooting_Tops.algorithm, sector, seviri_Overshooting_Tops.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_Overshooting_Tops.algorithm
                - seviri_Overshooting_Tops.colormapper
                - filename_formatter
                - sector
