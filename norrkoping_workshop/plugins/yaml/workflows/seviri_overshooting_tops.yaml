apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_overshooting_tops
docstring: |
    pass
spec:
    globals:
        product_name: OvershootingTops
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_OvershootingTops:
            kind: product
            name: [seviri, OvershootingTops]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_OvershootingTops.algorithm, sector, seviri_OvershootingTops.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_OvershootingTops.algorithm
                - seviri_OvershootingTops.colormapper
                - filename_formatter
                - sector
