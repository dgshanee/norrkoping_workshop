apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: DaySevereStorms
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_DaySevereStorms:
            kind: product
            name: [seviri, DaySevereStorms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_DaySevereStorms.algorithm, sector, seviri_DaySevereStorms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_DaySevereStorms.algorithm
                - seviri_DaySevereStorms.colormapper
                - filename_formatter
                - sector
