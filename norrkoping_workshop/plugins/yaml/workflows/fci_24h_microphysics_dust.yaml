apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_24h_microphysics_dust
docstring: |
    pass
spec:
    globals:
        product_name: 24H-Microphysics-Dust
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_24H_Microphysics_Dust:
            kind: product
            name: [fci, 24H-Microphysics-Dust]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_24H_Microphysics_Dust.algorithm, sector, fci_24H_Microphysics_Dust.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_24H_Microphysics_Dust.algorithm
                - fci_24H_Microphysics_Dust.colormapper
                - filename_formatter
                - sector
