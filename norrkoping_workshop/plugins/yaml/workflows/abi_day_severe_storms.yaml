apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: DaySevereStorms
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DaySevereStorms:
            kind: product
            name: [abi, DaySevereStorms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DaySevereStorms.algorithm, sector, abi_DaySevereStorms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DaySevereStorms.algorithm
                - abi_DaySevereStorms.colormapper
                - filename_formatter
                - sector
