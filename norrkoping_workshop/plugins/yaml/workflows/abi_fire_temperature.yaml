apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_fire_temperature
docstring: |
    pass
spec:
    globals:
        product_name: FireTemperature
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_FireTemperature:
            kind: product
            name: [abi, FireTemperature]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_FireTemperature.algorithm, sector, abi_FireTemperature.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_FireTemperature.algorithm
                - abi_FireTemperature.colormapper
                - filename_formatter
                - sector
