apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_fire_temperature
docstring: |
    pass
spec:
    globals:
        product_name: Fire-Temperature
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_Fire_Temperature:
            kind: product
            name: [abi, Fire-Temperature]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_Fire_Temperature.algorithm, sector, abi_Fire_Temperature.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_Fire_Temperature.algorithm
                - abi_Fire_Temperature.colormapper
                - filename_formatter
                - sector
