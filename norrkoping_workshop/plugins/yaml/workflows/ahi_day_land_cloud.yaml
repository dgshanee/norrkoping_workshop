apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_land_cloud
docstring: |
    pass
spec:
    globals:
        product_name: DayLandCloud
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayLandCloud:
            kind: product
            name: [ahi, DayLandCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayLandCloud.algorithm, sector, ahi_DayLandCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayLandCloud.algorithm
                - ahi_DayLandCloud.colormapper
                - filename_formatter
                - sector
