apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: Day-Severe-Storms
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_Day_Severe_Storms:
            kind: product
            name: [fci, Day-Severe-Storms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_Day_Severe_Storms.algorithm, sector, fci_Day_Severe_Storms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_Day_Severe_Storms.algorithm
                - fci_Day_Severe_Storms.colormapper
                - filename_formatter
                - sector
