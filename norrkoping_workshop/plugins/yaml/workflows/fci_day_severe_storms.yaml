apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: DaySevereStorms
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DaySevereStorms:
            kind: product
            name: [fci, DaySevereStorms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DaySevereStorms.algorithm, sector, fci_DaySevereStorms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DaySevereStorms.algorithm
                - fci_DaySevereStorms.colormapper
                - filename_formatter
                - sector
