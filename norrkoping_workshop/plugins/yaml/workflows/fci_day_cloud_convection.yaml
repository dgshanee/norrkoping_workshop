apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudConvection
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayCloudConvection:
            kind: product
            name: [fci, DayCloudConvection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayCloudConvection.algorithm, sector, fci_DayCloudConvection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayCloudConvection.algorithm
                - fci_DayCloudConvection.colormapper
                - filename_formatter
                - sector
