apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayMicrophysics:
            kind: product
            name: [fci, DayMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayMicrophysics.algorithm, sector, fci_DayMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayMicrophysics.algorithm
                - fci_DayMicrophysics.colormapper
                - filename_formatter
                - sector
