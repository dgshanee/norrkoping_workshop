apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: Night-Microphysics
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Night_Microphysics:
            kind: product
            name: [ahi, Night-Microphysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Night_Microphysics.algorithm, sector, ahi_Night_Microphysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Night_Microphysics.algorithm
                - ahi_Night_Microphysics.colormapper
                - filename_formatter
                - sector
