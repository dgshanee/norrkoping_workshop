apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: NightMicrophysics
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_NightMicrophysics:
            kind: product
            name: [ahi, NightMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_NightMicrophysics.algorithm, sector, ahi_NightMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_NightMicrophysics.algorithm
                - ahi_NightMicrophysics.colormapper
                - filename_formatter
                - sector
