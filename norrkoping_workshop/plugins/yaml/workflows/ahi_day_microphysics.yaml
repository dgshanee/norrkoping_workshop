apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: DayMicrophysics
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayMicrophysics:
            kind: product
            name: [ahi, DayMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayMicrophysics.algorithm, sector, ahi_DayMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayMicrophysics.algorithm
                - ahi_DayMicrophysics.colormapper
                - filename_formatter
                - sector
