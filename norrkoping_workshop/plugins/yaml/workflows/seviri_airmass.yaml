apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_airmass
docstring: |
    pass
spec:
    globals:
        product_name: Airmass
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_Airmass:
            kind: product
            name: [seviri, Airmass]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_Airmass.algorithm, sector, seviri_Airmass.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_Airmass.algorithm
                - seviri_Airmass.colormapper
                - filename_formatter
                - sector
