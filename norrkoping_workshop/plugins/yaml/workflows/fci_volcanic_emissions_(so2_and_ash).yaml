apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_volcanic_emissions_(so2_and_ash)
docstring: |
    pass
spec:
    globals:
        product_name: VolcanicEmissions(SO2andAsh)
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_VolcanicEmissions(SO2andAsh):
            kind: product
            name: [fci, VolcanicEmissions(SO2andAsh)]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_VolcanicEmissions(SO2andAsh).algorithm, sector, fci_VolcanicEmissions(SO2andAsh).coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_VolcanicEmissions(SO2andAsh).algorithm
                - fci_VolcanicEmissions(SO2andAsh).colormapper
                - filename_formatter
                - sector
