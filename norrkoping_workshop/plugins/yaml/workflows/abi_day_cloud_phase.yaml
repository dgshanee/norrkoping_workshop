apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_phase
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Phase
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_Day_Cloud_Phase:
            kind: product
            name: [abi, Day-Cloud-Phase]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_Day_Cloud_Phase.algorithm, sector, abi_Day_Cloud_Phase.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_Day_Cloud_Phase.algorithm
                - abi_Day_Cloud_Phase.colormapper
                - filename_formatter
                - sector
