apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_24h_microphysics_cloud
docstring: |
    pass
spec:
    globals:
        product_name: 24H-Microphysics-Cloud
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_24H_Microphysics_Cloud:
            kind: product
            name: [seviri, 24H-Microphysics-Cloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_24H_Microphysics_Cloud.algorithm, sector, seviri_24H_Microphysics_Cloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_24H_Microphysics_Cloud.algorithm
                - seviri_24H_Microphysics_Cloud.colormapper
                - filename_formatter
                - sector
