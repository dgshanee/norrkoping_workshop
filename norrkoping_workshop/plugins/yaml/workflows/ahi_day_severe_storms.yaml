apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: DaySevereStorms
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DaySevereStorms:
            kind: product
            name: [ahi, DaySevereStorms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DaySevereStorms.algorithm, sector, ahi_DaySevereStorms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DaySevereStorms.algorithm
                - ahi_DaySevereStorms.colormapper
                - filename_formatter
                - sector
