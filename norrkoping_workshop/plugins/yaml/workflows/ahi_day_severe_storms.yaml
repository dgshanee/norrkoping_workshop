apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_severe_storms
docstring: |
    pass
spec:
    globals:
        product_name: Day-Severe-Storms
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Day_Severe_Storms:
            kind: product
            name: [ahi, Day-Severe-Storms]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Day_Severe_Storms.algorithm, sector, ahi_Day_Severe_Storms.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Day_Severe_Storms.algorithm
                - ahi_Day_Severe_Storms.colormapper
                - filename_formatter
                - sector
