apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: Night-Microphysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_Night_Microphysics:
            kind: product
            name: [seviri, Night-Microphysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_Night_Microphysics.algorithm, sector, seviri_Night_Microphysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_Night_Microphysics.algorithm
                - seviri_Night_Microphysics.colormapper
                - filename_formatter
                - sector
