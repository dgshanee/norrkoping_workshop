apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: NightMicrophysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_NightMicrophysics:
            kind: product
            name: [seviri, NightMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_NightMicrophysics.algorithm, sector, seviri_NightMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_NightMicrophysics.algorithm
                - seviri_NightMicrophysics.colormapper
                - filename_formatter
                - sector
