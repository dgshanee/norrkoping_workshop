apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: NightMicrophysics
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_NightMicrophysics:
            kind: product
            name: [fci, NightMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_NightMicrophysics.algorithm, sector, fci_NightMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_NightMicrophysics.algorithm
                - fci_NightMicrophysics.colormapper
                - filename_formatter
                - sector
