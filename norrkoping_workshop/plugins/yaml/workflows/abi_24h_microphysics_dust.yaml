apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_24h_microphysics_dust
docstring: |
    pass
spec:
    globals:
        product_name: 24H-Microphysics-Dust
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_24H_Microphysics_Dust:
            kind: product
            name: [abi, 24H-Microphysics-Dust]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_24H_Microphysics_Dust.algorithm, sector, abi_24H_Microphysics_Dust.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_24H_Microphysics_Dust.algorithm
                - abi_24H_Microphysics_Dust.colormapper
                - filename_formatter
                - sector
