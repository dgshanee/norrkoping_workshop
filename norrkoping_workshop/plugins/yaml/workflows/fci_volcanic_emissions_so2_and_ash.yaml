apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_volcanic_emissions_so2_and_ash
docstring: |
    pass
spec:
    globals:
        product_name: VolcanicEmissionsSO2andAsh
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_VolcanicEmissionsSO2andAsh:
            kind: product
            name: [fci, VolcanicEmissionsSO2andAsh]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_VolcanicEmissionsSO2andAsh.algorithm, sector, fci_VolcanicEmissionsSO2andAsh.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_VolcanicEmissionsSO2andAsh.algorithm
                - fci_VolcanicEmissionsSO2andAsh.colormapper
                - filename_formatter
                - sector
