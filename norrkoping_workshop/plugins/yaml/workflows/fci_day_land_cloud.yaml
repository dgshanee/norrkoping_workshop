apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_land_cloud
docstring: |
    pass
spec:
    globals:
        product_name: DayLandCloud
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayLandCloud:
            kind: product
            name: [fci, DayLandCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayLandCloud.algorithm, sector, fci_DayLandCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayLandCloud.algorithm
                - fci_DayLandCloud.colormapper
                - filename_formatter
                - sector
