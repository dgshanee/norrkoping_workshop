apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_night_microphysics
docstring: |
    pass
spec:
    globals:
        product_name: NightMicrophysics
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_NightMicrophysics:
            kind: product
            name: [abi, NightMicrophysics]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_NightMicrophysics.algorithm, sector, abi_NightMicrophysics.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_NightMicrophysics.algorithm
                - abi_NightMicrophysics.colormapper
                - filename_formatter
                - sector
