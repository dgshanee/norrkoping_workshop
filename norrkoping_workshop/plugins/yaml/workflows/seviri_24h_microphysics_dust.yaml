apiVersion: geoips/v1
interface: workflows
family: order_based
name: seviri_24h_microphysics_dust
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsDust
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: seviri_hrit
            arguments:
                resampled_read: True
        seviri_24HMicrophysicsDust:
            kind: product
            name: [seviri, 24HMicrophysicsDust]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [seviri_24HMicrophysicsDust.algorithm, sector, seviri_24HMicrophysicsDust.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - seviri_24HMicrophysicsDust.algorithm
                - seviri_24HMicrophysicsDust.colormapper
                - filename_formatter
                - sector
