apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_volcanic_emissions_(so2_and_ash)
docstring: |
    pass
spec:
    globals:
        product_name: VolcanicEmissions(SO2andAsh)
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_VolcanicEmissions(SO2andAsh):
            kind: product
            name: [abi, VolcanicEmissions(SO2andAsh)]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_VolcanicEmissions(SO2andAsh).algorithm, sector, abi_VolcanicEmissions(SO2andAsh).coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_VolcanicEmissions(SO2andAsh).algorithm
                - abi_VolcanicEmissions(SO2andAsh).colormapper
                - filename_formatter
                - sector
