apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_24h_microphysics_dust
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsDust
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_24HMicrophysicsDust:
            kind: product
            name: [ahi, 24HMicrophysicsDust]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_24HMicrophysicsDust.algorithm, sector, ahi_24HMicrophysicsDust.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_24HMicrophysicsDust.algorithm
                - ahi_24HMicrophysicsDust.colormapper
                - filename_formatter
                - sector
