apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_type
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudType
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_DayCloudType:
            kind: product
            name: [abi, DayCloudType]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_DayCloudType.algorithm, sector, abi_DayCloudType.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_DayCloudType.algorithm
                - abi_DayCloudType.colormapper
                - filename_formatter
                - sector
