apiVersion: geoips/v1
interface: workflows
family: order_based
name: abi_day_cloud_type
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Type
    steps:
        sector:
            kind: sector
            name: conus
        reader:
            kind: reader
            name: abi_netcdf
            arguments:
                resampled_read: True
        abi_Day_Cloud_Type:
            kind: product
            name: [abi, Day-Cloud-Type]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [abi_Day_Cloud_Type.algorithm, sector, abi_Day_Cloud_Type.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - abi_Day_Cloud_Type.algorithm
                - abi_Day_Cloud_Type.colormapper
                - filename_formatter
                - sector
