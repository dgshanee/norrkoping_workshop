apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_day_fire
docstring: |
    pass
spec:
    globals:
        product_name: DayFire
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_DayFire:
            kind: product
            name: [fci, DayFire]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_DayFire.algorithm, sector, fci_DayFire.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_DayFire.algorithm
                - fci_DayFire.colormapper
                - filename_formatter
                - sector
