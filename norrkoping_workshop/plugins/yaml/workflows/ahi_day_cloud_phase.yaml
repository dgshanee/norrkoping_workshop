apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_cloud_phase
docstring: |
    pass
spec:
    globals:
        product_name: Day-Cloud-Phase
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_Day_Cloud_Phase:
            kind: product
            name: [ahi, Day-Cloud-Phase]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_Day_Cloud_Phase.algorithm, sector, ahi_Day_Cloud_Phase.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_Day_Cloud_Phase.algorithm
                - ahi_Day_Cloud_Phase.colormapper
                - filename_formatter
                - sector
