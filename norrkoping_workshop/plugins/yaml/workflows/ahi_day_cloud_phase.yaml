apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_cloud_phase
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudPhase
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayCloudPhase:
            kind: product
            name: [ahi, DayCloudPhase]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayCloudPhase.algorithm, sector, ahi_DayCloudPhase.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayCloudPhase.algorithm
                - ahi_DayCloudPhase.colormapper
                - filename_formatter
                - sector
