apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRVFog
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_HRVFog:
            kind: product
            name: [ahi, HRVFog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_HRVFog.algorithm, sector, ahi_HRVFog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_HRVFog.algorithm
                - ahi_HRVFog.colormapper
                - filename_formatter
                - sector
