apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_hrv_fog
docstring: |
    pass
spec:
    globals:
        product_name: HRV-Fog
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_HRV_Fog:
            kind: product
            name: [ahi, HRV-Fog]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_HRV_Fog.algorithm, sector, ahi_HRV_Fog.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_HRV_Fog.algorithm
                - ahi_HRV_Fog.colormapper
                - filename_formatter
                - sector
