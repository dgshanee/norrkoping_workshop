apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_24h_microphysics_cloud
docstring: |
    pass
spec:
    globals:
        product_name: 24HMicrophysicsCloud
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_24HMicrophysicsCloud:
            kind: product
            name: [ahi, 24HMicrophysicsCloud]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_24HMicrophysicsCloud.algorithm, sector, ahi_24HMicrophysicsCloud.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_24HMicrophysicsCloud.algorithm
                - ahi_24HMicrophysicsCloud.colormapper
                - filename_formatter
                - sector
