apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_overshooting_tops
docstring: |
    pass
spec:
    globals:
        product_name: OvershootingTops
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_OvershootingTops:
            kind: product
            name: [fci, OvershootingTops]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_OvershootingTops.algorithm, sector, fci_OvershootingTops.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_OvershootingTops.algorithm
                - fci_OvershootingTops.colormapper
                - filename_formatter
                - sector
