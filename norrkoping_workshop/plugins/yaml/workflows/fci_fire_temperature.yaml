apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_fire_temperature
docstring: |
    pass
spec:
    globals:
        product_name: Fire-Temperature
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_Fire_Temperature:
            kind: product
            name: [fci, Fire-Temperature]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_Fire_Temperature.algorithm, sector, fci_Fire_Temperature.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_Fire_Temperature.algorithm
                - fci_Fire_Temperature.colormapper
                - filename_formatter
                - sector
