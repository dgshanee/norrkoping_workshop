apiVersion: geoips/v1
interface: workflows
family: order_based
name: fci_fire_temperature
docstring: |
    pass
spec:
    globals:
        product_name: FireTemperature
    steps:
        sector:
            kind: sector
            name: africa
        reader:
            kind: reader
            name: fci_netcdf
            arguments:
                resampled_read: True
        fci_FireTemperature:
            kind: product
            name: [fci, FireTemperature]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [fci_FireTemperature.algorithm, sector, fci_FireTemperature.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - fci_FireTemperature.algorithm
                - fci_FireTemperature.colormapper
                - filename_formatter
                - sector
