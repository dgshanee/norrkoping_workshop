apiVersion: geoips/v1
interface: workflows
family: order_based
name: ahi_day_cloud_convection
docstring: |
    pass
spec:
    globals:
        product_name: DayCloudConvection
    steps:
        sector:
            kind: sector
            name: japan
        reader:
            kind: reader
            name: ahi_hsd
            arguments:
                resampled_read: True
        ahi_DayCloudConvection:
            kind: product
            name: [ahi, DayCloudConvection]
            depends_on: [sector, reader]
        filename_formatter:
            kind: filename_formatter
            name: geoips_fname
            depends_on: [ahi_DayCloudConvection.algorithm, sector, ahi_DayCloudConvection.coverage_checker]
        output_formatter:
            kind: output_formatter
            name: imagery_annotated
            depends_on:
                - ahi_DayCloudConvection.algorithm
                - ahi_DayCloudConvection.colormapper
                - filename_formatter
                - sector
