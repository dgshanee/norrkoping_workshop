name: fci
family: list
interface: products
docstring: |
    Products for rgb algorithms.
spec:
    products:
        - name: Airmass
          product_defaults: RGB-Default
          source_names: [fci]
          docstring: |
            pass
          spec:
            variables:
                - B11BT
                - B14BT
                - B10BT
                - B13BT
            algorithm:
                plugin:
                    name: config_rgb
                    arguments:
                        config_name: fci_airmass
