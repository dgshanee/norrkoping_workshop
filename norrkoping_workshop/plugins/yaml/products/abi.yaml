name: rgb
family: list
interface: products
docstring: |
  Products for rgb algorithms.
spec:
  products:
    - name: Airmass
      product_defaults: RGB-Default
      source_names: [abi]
      docstring: |
        pass
      spec:
        variables:
          - B08BT
          - B10BT
          - B12BT
          - B13BT
        algorithm:
          plugin:
            name: config_rgb
            arguments:
              config_name: "abi_airmass"
        # B08BT, B10BT R
        # B12BT, B13BT G
        # B08BT        B
    - name: 24H-Microphysics-Cloud
      product_defaults: RGB-Default
      source_names: [abi]
      docstring: | 
        pass
      spec:
        variables:
          - B15BT
          - B13BT
          - B14BT
          - B11BT
      algorithm:
        plugin:
          name: config_rgb
          arguments:
            config_name: "abi_24h_microphysics_cloud"
