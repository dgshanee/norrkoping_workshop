interface: algorithm_configs
apiVersion: geoips/v1
name: seviri_24h_microphysics_dust
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B10BT
                  - B09BT
        data_range: [-4.0, 2.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B09BT
                  - B07BT
        data_range: [0.0, 15.0]
        gamma: 2.5
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B09BT
        data_range: [261.0, 289.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
