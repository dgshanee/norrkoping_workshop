interface: algorithm_configs
apiVersion: geoips/v1
name: fci_airmass
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B10BT
                  - B11BT
        data_range: [-23.8, 1.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B13BT
                  - B14BT
        data_range: [-39.7, 4.1]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B10BT
        data_range: [244.5, 209.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
