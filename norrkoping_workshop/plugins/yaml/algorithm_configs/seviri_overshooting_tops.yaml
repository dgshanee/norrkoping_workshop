interface: algorithm_configs
apiVersion: geoips/v1
name: seviri_overshooting_tops
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B05BT
                  - B09BT
        data_range: [-25.0, 5.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B08BT
                  - B09BT
        data_range: [-30.0, 25.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B05BT
        data_range: [243.0, 190.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
