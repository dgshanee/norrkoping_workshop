interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_day_severe_storms
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B08BT
                  - B10BT
        data_range: [-36.0, 5.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B07BT
                  - B13BT
        data_range: [-1.0, 61.0]
        gamma: 0.5
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: difference
                variables:
                  - B05Ref
                  - B03Ref
        data_range: [-0.8, 0.26]
        gamma: 0.95
        input_units: reflectance
        output_units: reflectance
