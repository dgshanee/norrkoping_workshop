interface: algorithm_configs
apiVersion: geoips/v1
name: abi_day_fire
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B07BT
        data_range: [273.0, 333.0]
        gamma: 0.4
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: raw
                variables:
                  - B03Ref
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B02Ref
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
