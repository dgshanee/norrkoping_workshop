interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_day_snowfog
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B04Ref
        data_range: [0.0, 1.02]
        gamma: 1.6
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
                  - B05Ref
        data_range: [0.0, 0.68]
        gamma: 1.7
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B07BT
        data_range: [0.02, 0.45]
        gamma: 1.95
        input_units: reflectance
        output_units: reflectance
