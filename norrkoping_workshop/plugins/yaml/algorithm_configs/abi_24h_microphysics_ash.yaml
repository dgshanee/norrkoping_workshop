interface: algorithm_configs
apiVersion: geoips/v1
name: abi_24h_microphysics_ash
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B15BT
                  - B13BT
        data_range: [-6.7, 2.6]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B11BT
        data_range: [-6.0, 6.3]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [243.6, 302.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
