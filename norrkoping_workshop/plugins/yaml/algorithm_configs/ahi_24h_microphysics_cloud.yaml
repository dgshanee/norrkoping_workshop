interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_24h_microphysics_cloud
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B15BT
                  - B13BT
        data_range: [-7.5, 3.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B11BT
        data_range: [-0.4, 6.1]
        gamma: 1.1
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [248.6, 303.2]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
