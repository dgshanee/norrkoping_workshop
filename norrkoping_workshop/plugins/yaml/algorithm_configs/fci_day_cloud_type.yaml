interface: algorithm_configs
apiVersion: geoips/v1
name: fci_day_cloud_type
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B06Ref
        data_range: [0.0, 0.1]
        gamma: 1.5
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
                  - B03Ref
        data_range: [0.0, 0.8]
        gamma: 0.75
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B07Ref
        data_range: [0.0, 0.8]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
