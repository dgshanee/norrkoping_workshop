interface: algorithm_configs
apiVersion: geoips/v1
name: abi_day_snow-fog
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B03Ref
        data_range: [0.0, 1.0]
        gamma: 1.7
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
                  - B05Ref
        data_range: [0.0, 0.7]
        gamma: 1.7
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: difference
                variables:
                  - B07BT
                  - B13BT
        data_range: [0.0, 30.0]
        gamma: 1.7
        input_units: kelvin
        output_units: kelvin
