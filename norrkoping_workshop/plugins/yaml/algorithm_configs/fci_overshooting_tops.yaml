interface: algorithm_configs
apiVersion: geoips/v1
name: fci_overshooting_tops
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B10BT
                  - B14BT
        data_range: [-23.8, 6.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B13BT
                  - B14BT
        data_range: [-29.9, 23.6]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B10BT
        data_range: [244.5, 191.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
