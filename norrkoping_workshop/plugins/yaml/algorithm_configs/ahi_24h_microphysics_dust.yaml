interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_24h_microphysics_dust
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B15BT
                  - B13BT
        data_range: [-7.5, 3.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B11BT
        data_range: [-0.5, 15.0]
        gamma: 2.2
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [261.5, 289.2]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
