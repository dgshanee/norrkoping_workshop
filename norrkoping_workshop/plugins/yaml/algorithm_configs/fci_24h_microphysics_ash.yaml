interface: algorithm_configs
apiVersion: geoips/v1
name: fci_24h_microphysics_ash
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B15BT
                  - B14BT
        data_range: [-7.1, 2.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B12BT
        data_range: [-3.2, 4.4]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B14BT
        data_range: [242.8, 303.1]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
