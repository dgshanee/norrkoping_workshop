interface: algorithm_configs
apiVersion: geoips/v1
name: fci_day_severe_storms
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B10BT
                  - B11BT
        data_range: [-30.0, 0.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B09BT
                  - B14BT
        data_range: [0.0, 55.0]
        gamma: 0.5
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: difference
                variables:
                  - B07Ref
                  - B03Ref
        data_range: [-70.0, 20.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
