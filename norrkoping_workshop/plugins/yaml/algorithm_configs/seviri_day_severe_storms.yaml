interface: algorithm_configs
apiVersion: geoips/v1
name: seviri_day_severe_storms
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B05BT
                  - B06BT
        data_range: [-35.0, 5.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B04BT
                  - B09BT
        data_range: [-5.0, 60.0]
        gamma: 0.5
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: difference
                variables:
                  - B03Ref
                  - B01Ref
        data_range: [-0.75, 0.25]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
