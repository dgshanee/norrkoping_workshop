interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_day_microphysics_(with_nir_1.6,_legacy)
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B04Ref
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
                  - B05Ref
        data_range: [0.0, 0.7]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [203.0, 323.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
