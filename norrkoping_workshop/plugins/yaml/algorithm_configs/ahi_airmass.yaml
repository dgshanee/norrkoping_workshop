interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_airmass
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B08BT
                  - B10BT
        data_range: [-25.8, 0.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B12BT
                  - B13BT
        data_range: [-41.5, 4.3]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B08BT
        data_range: [242.6, 208.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
