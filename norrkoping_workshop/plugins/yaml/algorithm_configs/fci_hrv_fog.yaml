interface: algorithm_configs
apiVersion: geoips/v1
name: fci_hrv_fog
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B07Ref
        data_range: [0.0, 0.7]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
