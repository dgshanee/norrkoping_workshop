interface: algorithm_configs
apiVersion: geoips/v1
name: fci_volcanic_emissions_so2_and_ash
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B10BT
                  - B11BT
        data_range: [-4.0, 2.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B12BT
        data_range: [-4.0, 5.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B14BT
        data_range: [243.0, 303.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
