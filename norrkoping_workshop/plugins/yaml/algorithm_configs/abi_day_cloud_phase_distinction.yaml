interface: algorithm_configs
apiVersion: geoips/v1
name: abi_day_cloud_phase_distinction
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [280.7, 219.6]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: raw
                variables:
                  - B02Ref
        data_range: [0.0, 0.78]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B05Ref
        data_range: [0.01, 0.59]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
