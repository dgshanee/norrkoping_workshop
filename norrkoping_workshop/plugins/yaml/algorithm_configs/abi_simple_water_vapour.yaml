interface: algorithm_configs
apiVersion: geoips/v1
name: abi_simple_water_vapour
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [279.0, 202.3]
        gamma: 10.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: raw
                variables:
                  - B08BT
        data_range: [242.7, 214.7]
        gamma: 5.5
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B10BT
        data_range: [261.0, 245.1]
        gamma: 5.5
        input_units: kelvin
        output_units: kelvin
