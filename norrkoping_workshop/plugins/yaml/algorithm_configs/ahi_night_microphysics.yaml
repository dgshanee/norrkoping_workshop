interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_night_microphysics
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B15BT
                  - B13BT
        data_range: [-7.5, 3.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B13BT
                  - B07BT
        data_range: [-2.9, 7.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [243.7, 293.2]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
