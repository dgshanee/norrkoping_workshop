interface: algorithm_configs
apiVersion: geoips/v1
name: ahi_volcanic_emissions_(so2_and_ash)
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: difference
                variables:
                  - B09BT
                  - B10BT
        data_range: [-5.0, 6.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
    green:
        equation:
                type: difference
                variables:
                  - B14BT
                  - B11BT
        data_range: [-5.9, 5.1]
        gamma: 0.85
        input_units: kelvin
        output_units: kelvin
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [243.6, 302.2]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
