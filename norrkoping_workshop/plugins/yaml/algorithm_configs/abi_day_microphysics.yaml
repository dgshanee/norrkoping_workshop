interface: algorithm_configs
apiVersion: geoips/v1
name: abi_day_microphysics
family: standard
docstring:
    Configuration plugins for generic rgb recipes.
spec:
    algorithm: config_rgb
    red:
        equation:
                type: raw
                variables:
                  - B03Ref
        data_range: [0.0, 1.0]
        gamma: 1.0
        input_units: reflectance
        output_units: reflectance
    green:
        equation:
                type: raw
                variables:
                  - B07BT
        data_range: [0.0, 0.6]
        gamma: 2.5
        input_units: reflectance
        output_units: reflectance
    blue:
        equation:
                type: raw
                variables:
                  - B13BT
        data_range: [203.0, 323.0]
        gamma: 1.0
        input_units: kelvin
        output_units: kelvin
